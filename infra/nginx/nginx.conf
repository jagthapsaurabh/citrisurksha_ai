events { worker_connections 2048; }

http {
  upstream backend_pool {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s;
  }

  upstream ai_pool {
    least_conn;
    server ai-service:8100 max_fails=3 fail_timeout=10s;
  }

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=citri_cache:64m max_size=1g inactive=30m use_temp_path=off;

  server {
    listen 80;
    client_max_body_size 25m;

    location /api/ {
      proxy_pass http://backend_pool/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 10s;
      proxy_read_timeout 120s;
    }

    location /ai/ {
      rewrite ^/ai/(.*)$ /$1 break;
      proxy_pass http://ai_pool;
      proxy_set_header Host $host;
      proxy_cache citri_cache;
      proxy_cache_methods GET;
      proxy_cache_valid 200 10m;
    }

    location /health {
      return 200 'CitriSurksha load balancer is healthy';
      add_header Content-Type text/plain;
    }
  }
}
