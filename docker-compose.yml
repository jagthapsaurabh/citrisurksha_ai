services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai-service

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
      - ai-service
    expose:
      - "8000"
    volumes:
      - ./storage/uploads:/app/uploads
      - ./backend/firebase-service-account.json:/app/backend/firebase-service-account.json:ro
    deploy:
      replicas: 2

  ai-service:
    build: ./ai-service
    env_file: .env
    expose:
      - "8100"
    environment:
      FORCE_CPU: "true"
      TORCH_NUM_THREADS: "8"
    volumes:
      - ./ai-service/model-store:/app/model-store
      - ./ai-service/training-data:/app/training-data
      - ./storage/uploads:/app/uploads:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: citrisurksha
      POSTGRES_USER: citrisurksha
      POSTGRES_PASSWORD: citrisurksha
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
